databaseChangeLog:
  - changeSet:
      id: lab-3-categories
      author: Andriy Plaksenkov
      changes:
        - createTable:
            tableName: category
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
        - createSequence:
            sequenceName: seq_category_id
            incrementBy: 50
        - addUniqueConstraint:
            tableName: category
            columnNames: name
            constraintName: uq_category_name
