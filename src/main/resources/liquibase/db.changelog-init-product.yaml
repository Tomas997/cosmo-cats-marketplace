databaseChangeLog:
  - changeSet:
      id: lab-3-products
      author: Andriy Plaksenkov
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: price
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: product_reference
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: INTEGER
                  constraints:
                    nullable: false

        - createSequence:
            sequenceName: product_id_seq
            incrementBy: 50
        - addUniqueConstraint:
            tableName: product
            columnNames: product_reference
            constraintName: uq_product_reference
        - addUniqueConstraint:
            tableName: product
            columnNames: name, category_id
            constraintName: uq_product_name_category
        - addForeignKeyConstraint:
            baseTableName: product
            baseColumnNames: category_id
            referencedTableName: category
            referencedColumnNames: id
            constraintName: fk_product_category
            onDelete: CASCADE
        - createIndex:
            tableName: product
            columns:
              - column:
                  name: name
            indexName: idx_product_name
